name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Test and build
        run: npm run verify

      - name: Test desktop app
        run: npm run verify:desktop

      - name: Package isolated Preview app
        run: npm --prefix desktop run package:mac:dir

      - name: Smoke packaged Preview engine
        run: npm --prefix desktop run smoke:packaged

      - name: Package Chrome extension
        run: node scripts/package-extension.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: format-forge-extension
          path: release/*.zip
          if-no-files-found: error
