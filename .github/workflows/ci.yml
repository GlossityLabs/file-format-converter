name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm run verify

      - name: Package Chrome extension
        run: node scripts/package-extension.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: format-forge-extension
          path: release/*.zip
          if-no-files-found: error
