name: Release extension and Mac app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./desktop/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v${package_version}."
            exit 1
          fi
          if [[ "$desktop_version" != "$package_version" ]]; then
            echo "Desktop version $desktop_version does not match package version $package_version."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Test and build
        run: npm run verify

      - name: Test desktop app
        run: npm run verify:desktop

      - name: Package Chrome extension
        run: node scripts/package-extension.mjs

      - name: Require Apple release credentials
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for variable_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Required release secret $variable_name is missing."
              exit 1
            fi
          done

      - name: Build, sign and notarize universal Mac app and updater
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:desktop

      - name: Verify Mac signature and notarization
        shell: bash
        run: |
          app_path="desktop/release/mac-universal/Format Forge.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --verbose --type exec "$app_path"
          xcrun stapler validate "$app_path"

      - name: Create checksum
        shell: bash
        run: |
          shasum -a 256 release/format-forge-*.zip \
            desktop/release/format-forge-mac-*.dmg \
            desktop/release/format-forge-mac-*.zip \
            | sed -E 's#  (release/|desktop/release/)#  #' \
            > release/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/format-forge-${version}.zip" \
            desktop/release/format-forge-mac-*.dmg \
            desktop/release/format-forge-mac-*.dmg.blockmap \
            desktop/release/format-forge-mac-*.zip \
            desktop/release/format-forge-mac-*.zip.blockmap \
            desktop/release/latest-mac.yml \
            "release/SHA256SUMS.txt" \
            --verify-tag \
            --title "Format Forge ${version}" \
            --notes "Download format-forge-${version}.zip for Chrome. For Office, audio and video conversions on macOS, also install the signed and notarized universal Format Forge Mac DMG. Open the Mac app once; Chrome then connects automatically and future signed Mac updates are downloaded in the app." \
            --generate-notes
