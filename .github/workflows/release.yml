name: Release Chrome extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v${package_version}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm run verify

      - name: Package Chrome extension
        run: node scripts/package-extension.mjs

      - name: Create checksum
        shell: bash
        run: |
          cd release
          shasum -a 256 format-forge-*.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/format-forge-${version}.zip" \
            "release/SHA256SUMS.txt" \
            --verify-tag \
            --title "Format Forge ${version}" \
            --generate-notes
